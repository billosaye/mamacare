
spring:
  application:
    name: mamacare

  datasource:
    url: jdbc:postgresql://localhost:5432/mamacare_db
    username: mamacare_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
